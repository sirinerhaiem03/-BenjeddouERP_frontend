<div class="acces-refuse-wrapper">
  <!-- Particules d'arrière-plan -->
  <div class="particles">
    <span class="particle p1"></span>
    <span class="particle p2"></span>
    <span class="particle p3"></span>
    <span class="particle p4"></span>
    <span class="particle p5"></span>
  </div>

  <div class="acces-refuse-card">
    <!-- Icône animée -->
    <div class="icon-wrapper">
      <div class="icon-ring"></div>
      <span class="material-symbols-outlined lock-icon">lock</span>
    </div>

    <!-- Code d'erreur -->
    <div class="error-code">403</div>

    <!-- Titre -->
    <h1 class="error-title">Accès Refusé</h1>

    <!-- Description personnalisée -->
    <p class="error-desc">
      Bonjour <strong>{{ nomUtilisateur }}</strong>, votre rôle
      <span class="role-chip">{{ roleLabel }}</span>
      ne dispose pas de la permission pour accéder au module
      <span class="module-chip">{{ moduleLabel }}</span>.
    </p>

    <p class="error-hint">
      Contactez votre administrateur si vous pensez qu'il s'agit d'une erreur.
    </p>

    <!-- Action -->
    <button class="btn-retour" (click)="retourAccueil()">
      <span class="material-symbols-outlined">home</span>
      Retour à l'accueil
    </button>
  </div>
</div>
